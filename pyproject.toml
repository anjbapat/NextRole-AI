[project]
name = "nextrole-ai"
version = "0.1.0"
description = "A stateful job-fit and interview preparation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "openai>=1.100,<3",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.48,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

